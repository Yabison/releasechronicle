# Template vert — release terminée.
#
# Every value the dispatcher knows is available. `transition` and `kindLabel`
# are computed: `transition` is empty when there is none, so a creation no
# longer renders as a bare arrow between two blanks, and `kindLabel` is the
# sentence a reader understands where `kind` is the internal identifier.
#
#   identity     {kind} {kindLabel} {eventId} {type}
#   where        {company} {product} {service} {environment}
#   who / when   {actor} {when} {occurredAt}
#   deployment   {version} {status} {fromStatus} {toStatus} {transition}
#   incident     {incidentType}
#   maintenance  {scheduledAt} {windowStart} {windowEnd}
#   free text    {comment} {actionUrl}
email:
  subject: "🟢 [{product}/{service}] {kindLabel} — {environment}"
  body: |
    {kindLabel} sur {company} / {product} / {service}
    Environnement : {environment}
    Quand : {when}
    Version : {version}
    Statut : {status} {transition}
    Par : {actor}
    Type d'incident : {incidentType}
    Prévu le : {scheduledAt}
    Fenêtre : {windowStart} → {windowEnd}

    {comment}

    Action : {actionUrl}
    Référence : {eventId}
teams:
  title: "🟢 {kindLabel} — {product}/{service} ({environment})"
  text: |
    **{version}** {transition}
    Statut {status} · par {actor} · {when}
    {comment}
    {actionUrl}
