name: CI

# Flow: fix/* et feat/* -> PR vers rc -> PR de rc vers main -> tag v* = release.
# `rc` porte l'instance de démo (image ghcr .../releasechronicle:rc), main porte la
# release. Voir docs/ci-cd.md.
on:
  push:
    branches: [main, rc]
  pull_request:
    branches: [main, rc]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Same URL as vitest.config.ts injects; also used by prisma migrate deploy.
  TEST_DATABASE_URL: postgresql://rc:rc@localhost:5433/releasechronicle_test

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: ldapts@9 requires node >=22, same major as the Dockerfile.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The test suite needs the real containers: Postgres on 5433 (vitest.config.ts)
      # and the seeded LDAP on 1389 (tests/integration/ldap*.test.ts). Compose is used
      # rather than `services:` because the LDAP fixture is a bind mount from the
      # checkout, which does not exist yet when job services start.
      - name: Start test containers
        run: docker compose up -d db_test ldap

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T db_test pg_isready -U rc -d releasechronicle_test && exit 0
            sleep 2
          done
          echo "db_test never became ready"; docker compose logs db_test; exit 1

      - name: Wait for LDAP
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T ldap ldapsearch -x -H ldap://localhost \
              -D "cn=admin,dc=example,dc=org" -w adminpassword \
              -b "dc=example,dc=org" "(uid=alice)" uid >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "ldap never became ready"; docker compose logs ldap; exit 1

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          # next build runs with NODE_ENV=production, where the app refuses to start
          # on a missing/public session secret. Throwaway value, build-time only.
          AUTH_SECRET: ci-build-only-not-a-real-secret
          RC_WRITE_TOKEN: ci-build-only

      # After the build on purpose: tsconfig.json includes next-env.d.ts and
      # .next/types/**, both generated by `next build`. `next build` only typechecks
      # the app; this pass adds tests/ and prisma/.
      - name: Typecheck (app + tests)
        run: npx tsc --noEmit

      - name: Container logs on failure
        if: failure()
        run: docker compose logs db_test ldap

      - name: Tear down
        if: always()
        run: docker compose down -v

  security:
    name: Dependency audit + image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Advisory: a new upstream CVE must not turn every unrelated PR red.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - uses: docker/setup-buildx-action@v3

      - name: Build the runtime image (local, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: releasechronicle:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: releasechronicle:scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Code scanning upload needs GitHub Advanced Security on a private repo;
      # without it the API returns 403 and the job would go red for no good reason.
      - name: Upload Trivy results
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  publish:
    name: Publish images
    needs: [test]
    # rc   -> tag `rc`, the moving tag the demo server pulls
    # main -> tag `main`, integration only, deployed by nobody
    # The release images (semver + latest) are pushed by release-please.yml, not
    # here: a tag created with GITHUB_TOKEN does not trigger another workflow.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/rc' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      tag-rules: |
        type=ref,event=branch
        type=sha,format=long
