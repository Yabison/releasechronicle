# Single definition of "how we build and push the two images". Called by ci.yml
# (branches rc / main) and by release-please.yml (tag v*), so the build never drifts
# between the two paths.
name: Publish images

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Defaults to the caller's ref.
        type: string
        required: false
        default: ""
      tag-rules:
        description: docker/metadata-action `tags` input, one rule per line.
        type: string
        required: true
      build-version:
        description: >-
          Version the built app displays. Empty falls back to package.json.
          Keep it equal to the version inside the image tags.
        type: string
        required: false
        default: ""

jobs:
  publish:
    name: Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ inputs.tag-rules }}

      - name: Push the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          build-args: |
            RC_VERSION=${{ inputs.build-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The demo instance also needs the seeders + ticker, which the runtime image
      # deliberately excludes. Same tags with a -demo-tools suffix; the layers are
      # shared with the build above, so this is nearly free.
      - id: meta_demo
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-demo-tools,onlatest=true
          tags: ${{ inputs.tag-rules }}

      - name: Push the demo-tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: demo-tools
          push: true
          build-args: |
            RC_VERSION=${{ inputs.build-version }}
          tags: ${{ steps.meta_demo.outputs.tags }}
          labels: ${{ steps.meta_demo.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
